<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget - Personal Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar">
            <div class="sidebar-brand">
                <span>⚡ Expense Tracker</span>
            </div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">🏠 Dashboard</a></li>
                <li><a href="expenses.html">💰 Expenses</a></li>
                <li><a href="income.html">📈 Income</a></li>
                <li><a href="budget.html" class="active">💵 Budget</a></li>
                <li><a href="reports.html">📊 Reports</a></li>
                <li><a href="profile.html">👤 Profile</a></li>
            </ul>
            <div class="sidebar-logout">
                <button onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="page-header">
                <div>
                    <h1 class="page-title">Budget Management</h1>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;">Set monthly spending limits and monitor budget usage.</p>
                </div>
            </div>

            <!-- Alert Box -->
            <div id="alertBox" class="alert"></div>

            <!-- Month/Year Selector & Set Budget Form -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px;">
                    <div class="card-title" style="margin-bottom: 0;">Set Monthly Budget</div>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <select id="budgetMonth" class="form-control" style="width: 140px;" onchange="loadBudgets()">
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                        <select id="budgetYear" class="form-control" style="width: 100px;" onchange="loadBudgets()">
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>
                </div>

                <form id="setBudgetForm">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                        <div class="form-group">
                            <label for="budCategory">Category *</label>
                            <select id="budCategory" class="form-control" required>
                                <option value="">-- Select Category --</option>
                                <option value="Food">Food</option>
                                <option value="Transportation">Transportation</option>
                                <option value="School">School</option>
                                <option value="Bills">Bills</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Health">Health</option>
                                <option value="Travel">Travel</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="budAmount">Monthly Budget Limit (₱) *</label>
                            <input type="number" id="budAmount" class="form-control" placeholder="e.g. 5000" step="0.01" min="0.01" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">💵 Save Budget Limit</button>
                </form>
            </div>

            <!-- Warning Banner Container -->
            <div id="warningsContainer"></div>

            <!-- Budgets Overview Grid -->
            <div class="card">
                <div class="card-title">Budget Overview</div>
                <div id="budgetsList">
                    <p style="color: var(--text-muted);">Loading budgets...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('auth_token');
        if (!token) window.location.href = 'login.html';

        const now = new Date();
        document.getElementById('budgetMonth').value = now.getMonth() + 1;

        const yearSelect = document.getElementById('budgetYear');
        const currentYear = now.getFullYear();
        for (let y = currentYear - 2; y <= currentYear + 2; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            if (y === currentYear) opt.selected = true;
            yearSelect.appendChild(opt);
        }

        // Set Budget Form Handler
        document.getElementById('setBudgetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearAlert();

            const category = document.getElementById('budCategory').value;
            const amount = document.getElementById('budAmount').value;
            const month = document.getElementById('budgetMonth').value;
            const year = document.getElementById('budgetYear').value;

            if (!amount || parseFloat(amount) <= 0) {
                showAlert('Please enter a valid positive budget amount.', 'danger');
                return;
            }

            try {
                const response = await fetch('/api/budgets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ category, amount, month, year })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    showAlert('Budget set successfully!', 'success');
                    document.getElementById('budAmount').value = '';
                    loadBudgets();
                } else {
                    showAlert(data.message || 'Failed to save budget.', 'danger');
                }
            } catch (err) {
                showAlert('Network error occurred.', 'danger');
            }
        });

        // Load & Render Budgets
        async function loadBudgets() {
            const month = document.getElementById('budgetMonth').value;
            const year = document.getElementById('budgetYear').value;

            try {
                const response = await fetch(`/api/budgets?month=${month}&year=${year}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                const data = await response.json();
                if (data.success) {
                    renderBudgets(data.budgets);
                }
            } catch (err) {
                console.error('Error fetching budgets:', err);
            }
        }

        function renderBudgets(budgets) {
            const container = document.getElementById('budgetsList');
            const warningsContainer = document.getElementById('warningsContainer');
            warningsContainer.innerHTML = '';

            if (!budgets || budgets.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No monthly budgets configured for this period.</p>';
                return;
            }

            let warningsHtml = '';

            container.innerHTML = budgets.map(b => {
                if (b.warning) {
                    warningsHtml += `<div class="alert alert-warning" style="display:block;">${escapeHtml(b.warning)}</div>`;
                }

                let barClass = 'bg-success';
                if (b.percentageUsed >= 100) barClass = 'bg-danger';
                else if (b.percentageUsed >= 80) barClass = 'bg-warning';

                const pct = Math.min(b.percentageUsed, 100);

                return `
                    <div style="background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 18px; margin-bottom: 16px;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                            <div style="font-weight: 700; font-size: 1.05rem;">${escapeHtml(b.category)}</div>
                            <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.8rem;" onclick="deleteBudget(${b.id})">Remove</button>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; font-size: 0.9rem; margin-bottom: 10px;">
                            <div>Budget: <strong style="color: var(--accent-primary);">₱${Number(b.amount).toLocaleString('en-PH', { minimumFractionDigits: 2 })}</strong></div>
                            <div>Spent: <strong style="color: var(--accent-danger);">₱${Number(b.spent).toLocaleString('en-PH', { minimumFractionDigits: 2 })}</strong></div>
                            <div>Remaining: <strong style="color: ${b.remaining < 0 ? 'var(--accent-danger)' : 'var(--accent-success)'};">₱${Number(b.remaining).toLocaleString('en-PH', { minimumFractionDigits: 2 })}</strong></div>
                            <div>Usage: <strong>${b.percentageUsed.toFixed(1)}%</strong></div>
                        </div>
                        <div class="progress-container">
                            <div class="progress-bar ${barClass}" style="width: ${pct}%;"></div>
                        </div>
                    </div>
                `;
            }).join('');

            warningsContainer.innerHTML = warningsHtml;
        }

        async function deleteBudget(id) {
            if (!confirm('Are you sure you want to remove this budget limit?')) return;

            try {
                const response = await fetch(`/api/budgets?id=${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    loadBudgets();
                } else {
                    alert(data.message || 'Failed to delete budget.');
                }
            } catch (err) {
                alert('Network error.');
            }
        }

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.className = `alert alert-${type}`;
            box.textContent = msg;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }

        function clearAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('username');
            window.location.href = 'login.html';
        }

        loadBudgets();
    </script>
</body>
</html>
